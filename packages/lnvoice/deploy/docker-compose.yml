# lnvoice MongoDB — host port 53017 (53xxx range)
name: lnvoice
services:
  mongodb:
    image: mongo:7
    container_name: lnvoice-mongodb
    restart: unless-stopped
    ports:
      - "53017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-lnvoice}
    command: ["mongod", "--bind_ip_all", "--auth"]
    volumes:
      - ./mongodb/data:/data/db
